name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compute version for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install setuptools-scm
          BASE=$(python -m setuptools_scm | sed 's/+.*//' | sed 's/\.dev[0-9]*//')
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${BASE}.dev${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build package
        run: python -m build

      # Manual runs → TestPyPI
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      # Releases → real PyPI
      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
