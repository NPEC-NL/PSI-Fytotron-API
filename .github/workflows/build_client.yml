name: Generate Python Client from OpenAPI Spec

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenAPI_specification/PSI_fytotron_API.json'
      - '.github/workflows/generate-openapi-client.yml'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout triggering branch
        run: git checkout ${GITHUB_REF_NAME}

      - name: Generate Python client using OpenAPI Generator
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: python
          openapi-file: OpenAPI_specification/PSI_fytotron_API.json
          command-args: >-
            -o generated
            --additional-properties=packageName=fytotron

      - name: Copy generated code to /fytotron
        run: |
          if [ -d generated/fytotron ]; then
            rm -rf fytotron/
            mkdir -p fytotron
            cp -r generated/fytotron/* fytotron/
          fi

      - name: Copy generated docs to /docs/docs
        run: |
          if [ -d generated/docs ]; then
            rm -rf docs/
            mkdir -p docs
            mkdir -p docs/docs
            cp -r generated/docs/* docs/docs/
          fi

      - name: copy README to docs section
        run: |
          cp README.md docs/README.md

      - name: Copy python code to /test
        run: |
          if [ -d generated/test ]; then
            rm -rf test/
            mkdir -p test
            cp -r generated/test/* test/
          fi

      - name: Commit and push generated client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using GITHUB_TOKEN for authentication"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git add test
          git add fytotron
          git commit -m 'chore: regenerate python client from OpenAPI spec' || echo 'No changes to commit'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:${GITHUB_REF_NAME}
