name: Generate Python Client from OpenAPI Spec

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenAPI Specification/PSI_fytotron_API.json'
      - '.github/workflows/generate-openapi-client.yml'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Python client using OpenAPI Generator
        uses: addnab/docker-run-action@v3
        with:
          image: openapitools/openapi-generator-cli
          options: -v ${{ github.workspace }}:/local
          run: >
            openapi-generator-cli generate \
              -i /local/OpenAPI_specification/PSI_fytotron_API.json \
              -g python \
              -o /local/fytotron

      - name: Commit and push generated client
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add fytotron
          git commit -m 'chore: regenerate python client from OpenAPI spec' || echo 'No changes to commit'
          echo "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git
          git push