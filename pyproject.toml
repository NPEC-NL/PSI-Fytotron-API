[project]
name = "psi-fytotron"
description = "Python API implementation of PSI fytotron API"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["PSI", "fytotron", "API"]
license = {file = "LICENSE.txt"}
maintainers = [
  {name = "NPEC WUR"} # Optional
]
dynamic = ["version"]

classifiers = [
'Development Status :: 3 - Alpha',
'Intended Audience :: Developers',
'Intended Audience :: Science/Research',
'Topic :: Software Development :: Libraries :: Python Modules',
'Programming Language :: Python :: 3',
'Programming Language :: Python :: 3 :: Only',
'Operating System :: OS Independent',
'Operating System :: Microsoft :: Windows',
'Operating System :: POSIX',
'Operating System :: Unix',
'Operating System :: MacOS',
]

dependencies = [
  "certifi",
  "six",
  "python_dateutil>=2.8.2",
  "urllib3>=2.1.0,<3.0.0",
  "pydantic>=2",
  "typing-extensions>=4.7.1"
]

[project.optional-dependencies]
test = [
  "pytest>=7.2.1",
  "pytest-cov>=2.8.1",
  "tox>=3.9.0",
  "flake8>=4.0.0",
  "types-python-dateutil>=2.8.19.14",
  "mypy>=1.5"
]

build = [
  "build >= 1.0.3",
  "setuptools >= 21.0.0",
  "twine >= 4.0.2",
  "mkdocs >= 1.5.3",
  "mkdocs-material >= 9.5.6"
]

[tool.setuptools]
packages = ["fytotron"]

[project.urls]  # Optional
"Homepage" = "https://github.com/wurDevTim/PSI-Fytotron-API"

[build-system]
requires = ["setuptools>=43.0.0", "urllib3>=1.15.1", "six>=1.10", "wheel"]
build-backend = "setuptools.build_meta"
